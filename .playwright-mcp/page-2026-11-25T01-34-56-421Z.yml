                - heading "4. The rules the API keeps" [level=2] [ref=e1607]
                - paragraph [ref=e1608]: "Three rules shape everything you will read:"
                - list [ref=e1609]:
                  - listitem [ref=e1610]:
                    - text: Entities have readable ids and cannot be changed directly.
                    - code [ref=e1611]:
                      - link "s:blend.7" [ref=e1612] [cursor=pointer]:
                        - /url: "#"
                    - text: is a statement,
                    - code [ref=e1613]:
                      - link "v:blend.12" [ref=e1614] [cursor=pointer]:
                        - /url: "#"
                    - text: a value,
                    - code [ref=e1615]:
                      - link "insn:blend+0x1c@r6" [ref=e1616] [cursor=pointer]:
                        - /url: "#"
                    - text: an instruction. Handles are read-only proxies; an assignment or a misspelt member is refused with a code and a fix line.
                  - listitem [ref=e1617]: Change goes through passes. A pass declares what it writes, gets the facts it asked for, and changes the program through a transaction that records what each new thing was made from and why it is valid. Each pass that changes something makes one revision.
                  - listitem [ref=e1618]: Meaning is checked, not assumed. After every pass the program runs on generated inputs beside r0. The machine code runs beside the evaluator. Results, traps and memory must agree.
