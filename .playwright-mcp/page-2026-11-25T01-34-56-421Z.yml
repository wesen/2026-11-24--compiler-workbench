            - generic [ref=e1542]:
              - generic [ref=e1543]:
                - text: Chapter 1
                - emphasis [ref=e1544]: · Part I · The workbench
              - generic [ref=e1545]:
                - heading "A workbench, not a compiler" [level=1] [ref=e1546]
                - paragraph [ref=e1547]: This page compiles programs in a small typed language to RISC-V machine code and runs them, but the compiler is not the point. The point is to see what a compiler knows at each step, where every piece of the program came from, and why each change was allowed. Every number in this book was measured by running the workbench on its own projects.
                - heading "1. What is on the screen" [level=2] [ref=e1548]
                - paragraph [ref=e1549]: "The header names the open project, its revision and the last check. Under it are four tiles:"
                - list [ref=e1550]:
                  - listitem [ref=e1551]:
                    - text: "Files, Projects and Scripts on the left: the open project's files, 44 projects to study, and the project's scripts. A project is a folder of plain files: typed sources, workbench scripts that query and experiment, and UI scripts that add tiles of their own ("
                    - link "Projects and the UI DSL ▸" [ref=e1552] [cursor=pointer]:
                      - /url: "#"
                    - text: ).
                  - listitem [ref=e1553]: "Source, IR, CFG, Lineage, Facts in the middle: the program as written, as lifted into blocks of statements, as a graph, the provenance of whatever is selected, and the analyses' results."
                  - listitem [ref=e1554]: "Pipeline, Timeline, Checks, RV32, Run, Console underneath: what to run next, what has run, whether the meaning survived, the machine code, single runs, and a JavaScript console."
                  - listitem [ref=e1555]: "Agent, Book, Reference and Code on the right: an agent that drives the same API you do, this book, the API itself, and the workbench's own source."
                - paragraph [ref=e1556]:
                  - text: "A project's UI scripts add more:"
                  - link "Start here ▸" [ref=e1557] [cursor=pointer]:
                    - /url: "#"
                  - text: puts a status board, an O2 report and a next-pass helper beside the source.
                - paragraph [ref=e1558]: "That is only the default. Every tab can be dragged by its label: onto another tile's tab strip to move it there, onto the middle of a tile to add it to that tile, or onto a tile's edge to split the tile and give the view half of it. Gutters resize, × closes a view and + in any tile brings it back, ⤢ maximizes a tile, and the Layout menu has four arrangements (Workbench, Reading, Compiler, Agent). Whatever you arrange is kept in this browser."
                - paragraph [ref=e1559]: Select anything (a statement in IR, a line number in Source, an instruction in RV32) and every view highlights what is related to it.
                - heading "2. One program, start to finish" [level=2] [ref=e1560]
                - paragraph [ref=e1561]:
                  - text: Open
                  - link "Blend ▸" [ref=e1562] [cursor=pointer]:
                    - /url: "#"
                  - text: . It has a constant to fold, an expression to move out of a loop, and a bounds check on every read of the buffer.
                - generic [ref=e1563]: "function blend(work: buffer, n: i32, a: i32, b: i32): i32 { const scale = 4 * 16; let s = 0; for (let i = 0; i < n; i = i + 1) { s = s + work.charCodeAt(i) * (a * b + scale); } return s / 8; }"
                - paragraph [ref=e1565]:
                  - text: "At r0 the lifted program has 7 blocks and 13 statements, and its RV32 image is 96 bytes. Press Run in the header: the O2 pipeline makes six revisions (cfg, fold, simplify, constprop, dce, licm), checks the program against r0 after each, and the image shrinks to 88 bytes. On a 40-cell buffer with n = 40, the r0 image runs 531 instructions and the O2 image 451;"
                  - code [ref=e1566]: a * b + 64
                  - text: is now computed once, before the loop.
                - generic [ref=e1567]:
                  - generic [ref=e1568]: const p = wb.projects.open('blend').program; p.pipeline('O2'); return p.listing();
                  - button "Run in console" [ref=e1570] [cursor=pointer]
                - paragraph [ref=e1572]:
                  - text: Try it. Select
                  - code [ref=e1573]:
                    - link "s:blend.15" [ref=e1574] [cursor=pointer]:
                      - /url: "#"
                  - text: in the IR view after O2 and open Lineage. It says the statement was made by licm at r6 from the value
                  - code [ref=e1575]: (a * b) + 64
                  - text: ", which constprop made at r4 from"
                  - code [ref=e1576]: (a * b) + scale
                  - text: ", which the front end emitted for line 5. The because line names the loop that made the move valid."
                - heading "3. What is reused, and what is not" [level=2] [ref=e1577]
                - paragraph [ref=e1578]: "The workbench reuses from the repo only what its own pass manager does not cover. The front end (parsing, type checking, and the stack code it emits with source spans), the RV32 instruction encoders, the magic numbers for division by constants, the disassembler and the emulator are reused unchanged. Everything a pass could be written against is ours: the store, lifting, revisions, analyses, passes, checks, instruction selection and register allocation."
