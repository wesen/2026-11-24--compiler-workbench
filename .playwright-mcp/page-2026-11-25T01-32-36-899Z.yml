              - generic [ref=e354]:
                - heading "A workbench, not a compiler" [level=1] [ref=e355]
                - paragraph [ref=e356]: This page compiles programs in a small typed language to RISC-V machine code and runs them, but the compiler is not the point. The point is to see what a compiler knows at each step, where every piece of the program came from, and why each change was allowed. Every number in this book was measured by running the workbench on its own projects.
                - heading "1. What is on the screen" [level=2] [ref=e357]
                - paragraph [ref=e358]: "The header names the open project, its revision and the last check. Under it are four tiles:"
                - list [ref=e359]:
                  - listitem [ref=e360]:
                    - text: "Files, Projects and Scripts on the left: the open project's files, 44 projects to study, and the project's scripts. A project is a folder of plain files: typed sources, workbench scripts that query and experiment, and UI scripts that add tiles of their own ("
                    - link "Projects and the UI DSL ▸" [ref=e361] [cursor=pointer]:
                      - /url: "#"
                    - text: ).
                  - listitem [ref=e362]: "Source, IR, CFG, Lineage, Facts in the middle: the program as written, as lifted into blocks of statements, as a graph, the provenance of whatever is selected, and the analyses' results."
                  - listitem [ref=e363]: "Pipeline, Timeline, Checks, RV32, Run, Console underneath: what to run next, what has run, whether the meaning survived, the machine code, single runs, and a JavaScript console."
                  - listitem [ref=e364]: "Agent, Book, Reference and Code on the right: an agent that drives the same API you do, this book, the API itself, and the workbench's own source."
                - paragraph [ref=e365]:
                  - text: "A project's UI scripts add more:"
                  - link "Start here ▸" [ref=e366] [cursor=pointer]:
                    - /url: "#"
                  - text: puts a status board, an O2 report and a next-pass helper beside the source.
                - paragraph [ref=e367]: "That is only the default. Every tab can be dragged by its label: onto another tile's tab strip to move it there, onto the middle of a tile to add it to that tile, or onto a tile's edge to split the tile and give the view half of it. Gutters resize, × closes a view and + in any tile brings it back, ⤢ maximizes a tile, and the Layout menu has four arrangements (Workbench, Reading, Compiler, Agent). Whatever you arrange is kept in this browser."
                - paragraph [ref=e368]: Select anything (a statement in IR, a line number in Source, an instruction in RV32) and every view highlights what is related to it.
                - heading "2. One program, start to finish" [level=2] [ref=e369]
