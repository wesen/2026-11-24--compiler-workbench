                    - code [ref=e424]:
                      - link "insn:blend+0x1c@r6" [ref=e425] [cursor=pointer]:
                        - /url: "#"
                    - text: an instruction. Handles are read-only proxies; an assignment or a misspelt member is refused with a code and a fix line.
                  - listitem [ref=e426]: Change goes through passes. A pass declares what it writes, gets the facts it asked for, and changes the program through a transaction that records what each new thing was made from and why it is valid. Each pass that changes something makes one revision.
                  - listitem [ref=e427]: Meaning is checked, not assumed. After every pass the program runs on generated inputs beside r0. The machine code runs beside the evaluator. Results, traps and memory must agree.
