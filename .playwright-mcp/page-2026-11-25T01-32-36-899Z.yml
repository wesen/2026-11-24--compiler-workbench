                - paragraph [ref=e387]: "The workbench reuses from the repo only what its own pass manager does not cover. The front end (parsing, type checking, and the stack code it emits with source spans), the RV32 instruction encoders, the magic numbers for division by constants, the disassembler and the emulator are reused unchanged. Everything a pass could be written against is ours: the store, lifting, revisions, analyses, passes, checks, instruction selection and register allocation."
