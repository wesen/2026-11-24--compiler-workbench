                - heading "4. The rules the API keeps" [level=2] [ref=e416]
                - paragraph [ref=e417]: "Three rules shape everything you will read:"
                - list [ref=e418]:
                  - listitem [ref=e419]:
                    - text: Entities have readable ids and cannot be changed directly.
                    - code [ref=e420]:
                      - link "s:blend.7" [ref=e421] [cursor=pointer]:
                        - /url: "#"
                    - text: is a statement,
                    - code [ref=e422]:
